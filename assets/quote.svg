<svg xmlns="http://www.w3.org/2000/svg" width="680" height="128" viewBox="0 0 680 128" role="img" aria-label="O impedimento à ação faz a ação avançar. O que está no caminho se torna o caminho. Marco Aurélio, Meditações">
<style>.w{opacity:0;animation:w .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes w{to{opacity:1}}
.sig{opacity:0;animation:w .9s ease-out 2.97s forwards}
@media (prefers-reduced-motion: reduce){.w,.sig{animation:none;opacity:1}}</style>
<rect x="0.5" y="0.5" width="679" height="127" rx="12" fill="#090C12" stroke="#30363D"/>
<text x="340" y="48" text-anchor="middle" style="font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:21px;font-style:italic" fill="#E6EDF3"><tspan class="w" style="animation-delay:0.30s">O </tspan><tspan class="w" style="animation-delay:0.41s">impedimento </tspan><tspan class="w" style="animation-delay:0.52s">à </tspan><tspan class="w" style="animation-delay:0.63s">ação </tspan><tspan class="w" style="animation-delay:0.74s">faz </tspan><tspan class="w" style="animation-delay:0.85s">a </tspan><tspan class="w" style="animation-delay:0.96s">ação </tspan><tspan class="w" style="animation-delay:1.07s">avançar. </tspan></text>
<text x="340" y="80" text-anchor="middle" style="font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:24px;font-style:italic" fill="#2FD3B4"><tspan class="w" style="animation-delay:1.58s">O </tspan><tspan class="w" style="animation-delay:1.69s">que </tspan><tspan class="w" style="animation-delay:1.80s">está </tspan><tspan class="w" style="animation-delay:1.91s">no </tspan><tspan class="w" style="animation-delay:2.02s">caminho </tspan><tspan class="w" style="animation-delay:2.13s">se </tspan><tspan class="w" style="animation-delay:2.24s">torna </tspan><tspan class="w" style="animation-delay:2.35s">o </tspan><tspan class="w" style="animation-delay:2.46s">caminho. </tspan></text>
<text class="sig" x="340" y="110" text-anchor="middle" style="font-family:ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace;font-size:12px;letter-spacing:0.04em" fill="#8B949E">marco aurélio · meditações</text>
</svg>