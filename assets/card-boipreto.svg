<svg xmlns="http://www.w3.org/2000/svg" width="340" height="186" viewBox="0 0 340 186" role="img" aria-label="boipreto: Site institucional para uma consultoria do agronegócio.">
<style>.f{opacity:0;animation:f .7s cubic-bezier(.22,1,.36,1) .15s forwards}.f2{animation-delay:.4s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.p{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.sweep{animation:s 7s cubic-bezier(.65,0,.35,1) infinite 1s}@keyframes s{0%{transform:translateX(-120px)}40%,100%{transform:translateX(340px)}}
@media (prefers-reduced-motion: reduce){.f,.p,.sweep{animation:none;opacity:1}.sweep{opacity:0}}</style>
<defs><linearGradient id="h" x1="0" x2="1"><stop offset="0" stop-color="#2FD3B4" stop-opacity="0"/><stop offset=".5" stop-color="#2FD3B4" stop-opacity=".8"/><stop offset="1" stop-color="#2FD3B4" stop-opacity="0"/></linearGradient>
<clipPath id="k"><rect x="1" y="1" width="338" height="184" rx="10"/></clipPath></defs>
<rect x="0.5" y="0.5" width="339" height="185" rx="10" fill="#0F141B" stroke="#30363D"/>
<g clip-path="url(#k)"><rect class="sweep" x="0" y="0.5" width="120" height="1.5" fill="url(#h)"/></g>
<g class="f"><text x="22" y="42" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:700" fill="#E6EDF3">boipreto</text>
<rect x="254.0" y="25" width="64" height="22" rx="11" fill="none" stroke="#30363D"/>
<circle class="p" cx="266" cy="36" r="3" fill="#3FB950"/>
<text x="274" y="40" style="font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Consolas,Menlo,monospace;font-size:11.5px" fill="#3FB950">no ar</text></g>
<g class="f f2"><text x="22" y="78" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:14.5px" fill="#ADB6C0"><tspan x="22" dy="0">Site institucional para uma</tspan><tspan x="22" dy="21">consultoria do agronegócio.</tspan></text>
<text x="22" y="164" style="font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Consolas,Menlo,monospace;font-size:12px" fill="#2FD3B4">react 19 · typescript · tailwind</text></g>
</svg>