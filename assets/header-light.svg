<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" role="img" aria-label="Miguel Ribas Berlese, full-stack developer, Ribeirão Preto, Brazil">
<style>
.n{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:50px;font-weight:700;letter-spacing:-0.02em}
.c{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Consolas,Menlo,monospace;font-size:13px;fill:#59636E}
.sweep{animation:terminator 16s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes terminator{from{transform:translateX(-420px)}to{transform:translateX(250px)}}
@media (prefers-reduced-motion: reduce){.sweep{animation:none;transform:translateX(250px)}}
</style>
<defs>
 <linearGradient id="edge" x1="0" x2="1">
  <stop offset="0" stop-color="#fff"/><stop offset="0.82" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <mask id="light" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="128">
  <rect class="sweep" x="-1000" y="0" width="1600" height="128" fill="url(#edge)"/>
 </mask>
</defs>
<text x="0" y="58" class="n" fill="#B4BAC1">Miguel Ribas Berlese</text>
<text x="0" y="58" class="n" fill="#1F2328" mask="url(#light)">Miguel Ribas Berlese</text>
<line x1="1" y1="84" x2="640" y2="84" stroke="#D1D9E0" stroke-width="1"/>
<text x="1" y="110" class="c">full-stack developer</text>
<text x="639" y="110" class="c" text-anchor="end">ribeirão preto, br · 21.17°S 47.81°W</text>
</svg>