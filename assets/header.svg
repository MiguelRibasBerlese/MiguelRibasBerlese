<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Miguel Ribas Berlese, desenvolvedor full-stack, IA e automação">
<style>
.tw{opacity:.25;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.9}}
.meteor{opacity:0;animation:meteor 9s cubic-bezier(.22,1,.36,1) infinite 2s}
@keyframes meteor{0%{opacity:0;transform:translate(0,0)}4%{opacity:.9}16%{opacity:0;transform:translate(300px,110px)}100%{opacity:0;transform:translate(300px,110px)}}
.glow{animation:glow 6s ease-in-out infinite;transform-origin:540px 120px}
@keyframes glow{50%{transform:scale(1.08);opacity:.75}}
.in1{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) .2s forwards}
.in2{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) .6s forwards}
.in3{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) 1s forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dot{animation:dot 2s ease-in-out infinite}
@keyframes dot{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.tw,.meteor,.glow,.dot{animation:none}.in1,.in2,.in3{animation:none;opacity:1}}
</style>
<defs>
