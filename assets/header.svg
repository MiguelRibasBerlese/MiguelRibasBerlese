 <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2FD3B4" stop-opacity="0.22"/><stop offset="1" stop-color="#2FD3B4" stop-opacity="0"/></radialGradient>
