name: update activity graph

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gera o gráfico
        run: python3 scripts/activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Salva se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || (git commit -m "Atualiza o gráfico de atividade" && git push)
